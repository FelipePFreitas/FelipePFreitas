name: Generate Snake

on:
  schedule:
    # Roda automaticamente a cada 12 horas
    - cron: "0 */12 * * *"
  
  # Permite rodar manualmente na aba Actions
  workflow_dispatch:
  
  # Roda sempre que você fizer um push na branch main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Permissão necessária para criar a branch 'output' e salvar os SVGs
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Gera os gráficos da cobrinha (claro e escuro)
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Envia os arquivos gerados para a branch 'output'
      - name: Push Snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
